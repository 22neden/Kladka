services:
  - type: web
    name: kladka-api
    runtime: node
    plan: free
    rootDir: apps/backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_ORIGINS
        sync: false
      - key: OAUTH_REDIRECTS
        sync: false
      - key: MAIL_MODE
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: TERMS_URL
        sync: false
      - key: MODERATION_MODE
        value: manual
  - type: web
    name: kladka-web
    runtime: static
    rootDir: apps/frontend
    buildCommand: npm ci --include=dev && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: EXPO_PUBLIC_API_URL
        sync: false
      - key: EXPO_PUBLIC_TERMS_URL
        sync: false
      - key: EXPO_PUBLIC_PRIVACY_URL
        sync: false
      - key: EXPO_PUBLIC_SUPPORT_EMAIL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
